<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DoodleLab — Interactive Science Adventure</title>
  <!-- Google Fonts untuk gaya Handwritten, Rounded, dan Clean Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #FFF8E9;
      --bg-paper: #FFFDF7;
      --ink-black: #292D32;
      --ink-muted: #5A6069;
      --doodle-blue: #75B9E7;
      --playful-purple: #A994E8;
      --science-green: #91C99A;
      --warm-yellow: #FFD66B;
      --soft-coral: #F28F83;

      --font-display: 'Patrick Hand', cursive, sans-serif;
      --font-ui: 'Fredoka', sans-serif;
      --font-body: 'Nunito', sans-serif;

      /* Bentuk organik khas gambar tangan */
      --sketch-radius-1: 255px 15px 225px 15px / 15px 225px 15px 255px;
      --sketch-radius-2: 18px 240px 14px 230px / 230px 14px 240px 18px;
      --sketch-radius-btn: 35px 12px 30px 14px / 14px 30px 12px 35px;
      --sketch-shadow: 4px 4px 0px var(--ink-black);
      --sketch-shadow-sm: 2px 2px 0px var(--ink-black);
      --sketch-shadow-lg: 6px 6px 0px var(--ink-black);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-cream);
      /* Pola kertas buku catatan sains (dot-grid halus) */
      background-image: radial-gradient(rgba(41, 45, 50, 0.14) 1.2px, transparent 1.2px);
      background-size: 22px 22px;
      color: var(--ink-black);
      font-family: var(--font-body);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Typography Helpers */
    h1, h2, h3, .hand-title {
      font-family: var(--font-display);
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .ui-font {
      font-family: var(--font-ui);
    }

    /* Doodle Card Component */
    .doodle-card {
      background: var(--bg-paper);
      border: 3px solid var(--ink-black);
      border-radius: var(--sketch-radius-1);
      box-shadow: var(--sketch-shadow);
      padding: 1.35rem;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      position: relative;
    }

    .doodle-card.interactive:hover {
      transform: translateY(-3px) rotate(-0.6deg);
      box-shadow: var(--sketch-shadow-lg);
    }

    .doodle-card.alt-border {
      border-radius: var(--sketch-radius-2);
    }

    /* Doodle Buttons */
    .doodle-btn {
      font-family: var(--font-ui);
      font-weight: 600;
      font-size: 0.98rem;
      color: var(--ink-black);
      background: var(--warm-yellow);
      border: 2.5px solid var(--ink-black);
      border-radius: var(--sketch-radius-btn);
      box-shadow: var(--sketch-shadow-sm);
      padding: 0.6rem 1.2rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
      user-select: none;
    }

    .doodle-btn:hover:not(:disabled) {
      transform: translate(-1px, -2px) rotate(-1deg);
      box-shadow: 4px 4px 0px var(--ink-black);
    }

    .doodle-btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--ink-black);
    }

    .doodle-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .doodle-btn.blue { background: var(--doodle-blue); }
    .doodle-btn.green { background: var(--science-green); }
    .doodle-btn.purple { background: var(--playful-purple); }
    .doodle-btn.coral { background: var(--soft-coral); }
    .doodle-btn.cream { background: var(--bg-cream); }
    .doodle-btn.sm { padding: 0.4rem 0.85rem; font-size: 0.88rem; }

    /* Sketch Progress Bar */
    .sketch-progress-wrap {
      width: 100%;
      height: 18px;
      background: #EFE7D6;
      border: 2.5px solid var(--ink-black);
      border-radius: 20px 8px 22px 10px / 10px 22px 8px 20px;
      overflow: hidden;
      position: relative;
    }

    .sketch-progress-fill {
      height: 100%;
      background: var(--science-green);
      border-right: 2px solid var(--ink-black);
      transition: width 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      background-image: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 8px,
        rgba(255, 255, 255, 0.28) 8px,
        rgba(255, 255, 255, 0.28) 16px
      );
    }

    /* Header & Navigation */
    header.top-bar {
      background: var(--bg-paper);
      border-bottom: 3px solid var(--ink-black);
      padding: 0.85rem 1.25rem;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .header-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      cursor: pointer;
    }

    .brand-logo h1 {
      font-size: 1.95rem;
      color: var(--ink-black);
      text-shadow: 2px 2px 0px var(--warm-yellow);
    }

    .brand-tagline {
      font-size: 0.78rem;
      font-family: var(--font-ui);
      background: var(--doodle-blue);
      border: 2px solid var(--ink-black);
      padding: 0.1rem 0.55rem;
      border-radius: 12px;
      transform: rotate(-2deg);
    }

    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .nav-tab {
      font-family: var(--font-ui);
      font-weight: 600;
      font-size: 0.92rem;
      padding: 0.45rem 0.95rem;
      border: 2.5px solid var(--ink-black);
      border-radius: 16px 8px 18px 6px;
      background: var(--bg-cream);
      color: var(--ink-black);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-tab:hover {
      background: var(--warm-yellow);
      transform: translateY(-2px);
    }

    .nav-tab.active {
      background: var(--warm-yellow);
      box-shadow: 3px 3px 0px var(--ink-black);
      transform: translateY(-2px);
    }

    /* Main Container */
    main.container {
      max-width: 1180px;
      margin: 1.5rem auto 3.5rem;
      padding: 0 1.25rem;
    }

    /* Player Status Strip */
    .player-banner {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 1.25rem;
      margin-bottom: 1.75rem;
      background: linear-gradient(135deg, #FFFDF7 0%, #FFF3D6 100%);
    }

    @media (max-width: 768px) {
      .player-banner {
        grid-template-columns: 1fr;
      }
    }

    .player-identity {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .avatar-doodle {
      width: 68px;
      height: 68px;
      flex-shrink: 0;
      background: var(--playful-purple);
      border: 3px solid var(--ink-black);
      border-radius: 50% 45% 55% 48%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 3px 3px 0px var(--ink-black);
    }

    .alias-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .alias-name {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
    }

    .edit-alias-btn {
      background: var(--bg-paper);
      border: 2px solid var(--ink-black);
      border-radius: 8px;
      padding: 0.15rem 0.45rem;
      font-size: 0.8rem;
      font-family: var(--font-ui);
      cursor: pointer;
    }

    .stat-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.45rem;
    }

    .stat-pill {
      font-family: var(--font-ui);
      font-size: 0.88rem;
      padding: 0.25rem 0.75rem;
      border: 2px solid var(--ink-black);
      border-radius: 20px;
      font-weight: 600;
    }

    /* Grid Layouts */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.35rem;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.35rem;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.2rem;
    }

    @media (max-width: 960px) {
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .grid-3 { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 640px) {
      .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
    }

    /* Section Headings */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.15rem;
    }

    .section-title {
      font-size: 1.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      position: relative;
    }

    .section-title::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -3px;
      width: 100%;
      height: 5px;
      background: var(--warm-yellow);
      border-radius: 4px;
      z-index: -1;
    }

    /* Category Badges & Colors */
    .cat-Fisika { background-color: var(--doodle-blue); }
    .cat-Kimia { background-color: var(--warm-yellow); }
    .cat-Biologi { background-color: var(--science-green); }
    .cat-Astronomi { background-color: var(--playful-purple); }

    .tag-badge {
      display: inline-block;
      font-family: var(--font-ui);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.2rem 0.65rem;
      border: 2px solid var(--ink-black);
      border-radius: 14px 6px 14px 6px;
    }

    /* Materi Card & Detail */
    .materi-illustration {
      width: 100%;
      height: 135px;
      background: var(--bg-cream);
      border: 2.5px solid var(--ink-black);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.85rem;
      overflow: hidden;
    }

    .materi-content-box p {
      margin-bottom: 1rem;
      font-size: 1.04rem;
    }

    .formula-note {
      background: #FFF4D4;
      border: 2.5px dashed var(--ink-black);
      border-radius: 14px;
      padding: 0.9rem 1.1rem;
      margin: 1rem 0;
      font-weight: 700;
    }

    /* Quiz Styling */
    .quiz-option {
      width: 100%;
      text-align: left;
      background: var(--bg-paper);
      border: 2.5px solid var(--ink-black);
      border-radius: 16px 10px 18px 8px;
      padding: 0.85rem 1.1rem;
      margin-bottom: 0.75rem;
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 3px 3px 0px var(--ink-black);
      transition: transform 0.12s ease, background-color 0.15s ease;
    }

    .quiz-option:hover:not(:disabled) {
      background: #FFF3D1;
      transform: translateX(4px);
    }

    .quiz-option.correct {
      background: var(--science-green);
    }

    .quiz-option.wrong {
      background: var(--soft-coral);
    }

    .option-letter {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--ink-black);
      background: var(--bg-cream);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-ui);
      flex-shrink: 0;
    }

    /* Simulation Canvas Box */
    .sim-canvas-wrapper {
      background: #FFFFFF;
      border: 3px solid var(--ink-black);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--sketch-shadow);
      position: relative;
    }

    canvas.sim-canvas {
      display: block;
      width: 100%;
      height: 360px;
      cursor: crosshair;
    }

    .sim-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      background: var(--bg-cream);
      border: 2.5px solid var(--ink-black);
      border-radius: 14px;
      padding: 0.9rem 1.1rem;
      margin-top: 1rem;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      min-width: 160px;
    }

    .control-group label {
      font-family: var(--font-ui);
      font-size: 0.85rem;
      font-weight: 600;
    }

    input[type="range"] {
      accent-color: var(--ink-black);
      cursor: pointer;
    }

    /* Sticker Badges */
    .sticker-badge {
      border: 2.5px solid var(--ink-black);
      border-radius: 20px;
      padding: 0.9rem;
      text-align: center;
      background: var(--bg-paper);
      box-shadow: 3px 3px 0px var(--ink-black);
      transition: transform 0.2s ease;
    }

    .sticker-badge.locked {
      opacity: 0.52;
      filter: grayscale(85%);
      border-style: dashed;
      box-shadow: none;
    }

    .sticker-badge.unlocked {
      background: linear-gradient(180deg, #FFFDF7 0%, #FFF2CC 100%);
    }

    .sticker-badge.unlocked:hover {
      transform: scale(1.04) rotate(2deg);
    }

    .sticker-icon {
      font-size: 2.3rem;
      margin-bottom: 0.35rem;
      display: block;
    }

    /* Leaderboard Table */
    .lb-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 1rem;
      border: 2.5px solid var(--ink-black);
      border-radius: 16px;
      margin-bottom: 0.65rem;
      background: var(--bg-paper);
      box-shadow: 2px 2px 0px var(--ink-black);
    }

    .lb-row.is-me {
      background: var(--warm-yellow);
      transform: scale(1.01);
      box-shadow: 4px 4px 0px var(--ink-black);
    }

    /* Toast & Modal Overlays */
    #toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      pointer-events: none;
    }

    .doodle-toast {
      background: var(--warm-yellow);
      border: 3px solid var(--ink-black);
      border-radius: 18px 8px 18px 8px;
      box-shadow: 4px 4px 0px var(--ink-black);
      padding: 0.75rem 1.1rem;
      font-family: var(--font-ui);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-width: 320px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(41, 45, 50, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 90;
      padding: 1rem;
    }

    .modal-box {
      background: var(--bg-paper);
      border: 3.5px solid var(--ink-black);
      border-radius: var(--sketch-radius-1);
      box-shadow: 8px 8px 0px var(--ink-black);
      max-width: 480px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.65rem;
      text-align: center;
      animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Premium & Auth Styling */
    .pro-badge {
      background: linear-gradient(135deg, var(--warm-yellow) 0%, #FFB84D 100%);
      border: 2px solid var(--ink-black);
      border-radius: 14px;
      padding: 0.15rem 0.6rem;
      font-family: var(--font-ui);
      font-size: 0.78rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      box-shadow: 2px 2px 0px var(--ink-black);
    }

    .free-badge {
      background: var(--bg-cream);
      border: 2px solid var(--ink-black);
      border-radius: 14px;
      padding: 0.15rem 0.6rem;
      font-family: var(--font-ui);
      font-size: 0.78rem;
      font-weight: 600;
    }

    .doodle-input {
      width: 100%;
      padding: 0.68rem 0.95rem;
      border: 2.5px solid var(--ink-black);
      border-radius: 14px 8px 14px 8px;
      font-family: var(--font-body);
      font-size: 0.98rem;
      font-weight: 700;
      background: var(--bg-cream);
      color: var(--ink-black);
      outline: none;
    }

    .doodle-input:focus {
      background: #FFFDF7;
      box-shadow: 3px 3px 0px var(--doodle-blue);
    }

    .plan-card {
      border: 3px solid var(--ink-black);
      border-radius: 20px 10px 20px 10px;
      padding: 1.1rem;
      background: var(--bg-paper);
      box-shadow: 3px 3px 0px var(--ink-black);
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
      text-align: left;
    }

    .plan-card.selected {
      background: #FFF3D1;
      transform: translateY(-3px);
      box-shadow: 5px 5px 0px var(--ink-black);
    }

    .pay-method-btn {
      border: 2.5px solid var(--ink-black);
      border-radius: 14px;
      padding: 0.65rem 0.85rem;
      background: var(--bg-paper);
      font-family: var(--font-ui);
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 0.55rem;
    }

    .pay-method-btn.active {
      background: var(--doodle-blue);
      box-shadow: 3px 3px 0px var(--ink-black);
    }

    .locked-overlay-tag {
      background: var(--warm-yellow);
      border: 2px solid var(--ink-black);
      border-radius: 12px;
      padding: 0.2rem 0.55rem;
      font-family: var(--font-ui);
      font-size: 0.76rem;
      font-weight: 700;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.85) rotate(-2deg); }
      to { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- TOP NAVIGATION -->
  <header class="top-bar">
    <div class="header-inner">
      <div class="brand-logo" onclick="navigate('dashboard')">
        <!-- Inline Doodle Flask Logo -->
        <svg width="42" height="42" viewBox="0 0 48 48" fill="none" stroke="#292D32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8H30M20 8V18L10 36C8.8 38.2 10.4 41 13 41H35C37.6 41 39.2 38.2 38 36L28 18V8" fill="#FFFDF7"/>
          <path d="M13.5 31H34.5L37.5 36.5C38.2 38 37.1 39.8 35.4 39.8H12.6C10.9 39.8 9.8 38 10.5 36.5L13.5 31Z" fill="#91C99A"/>
          <circle cx="21" cy="25" r="2" fill="#FFD66B"/>
          <circle cx="27" cy="21" r="1.5" fill="#75B9E7"/>
          <path d="M35 6L36.5 9.5L40 11L36.5 12.5L35 16L33.5 12.5L30 11L33.5 9.5L35 6Z" fill="#FFD66B" stroke-width="2"/>
        </svg>
        <div>
          <h1>DoodleLab</h1>
          <span class="brand-tagline">Interactive Science Adventure</span>
        </div>
      </div>

      <nav class="nav-tabs" id="main-nav">
        <button class="nav-tab active" data-view="dashboard" onclick="navigate('dashboard')">📓 Beranda</button>
        <button class="nav-tab" data-view="materi" onclick="navigate('materi')">🔬 Materi Sains</button>
        <button class="nav-tab" data-view="kuis" onclick="navigate('kuis')">✏️ Kuis Interaktif</button>
        <button class="nav-tab" data-view="simulasi" onclick="navigate('simulasi')">⚡ Lab Simulasi</button>
        <button class="nav-tab" data-view="pencapaian" onclick="navigate('pencapaian')">🏆 Pencapaian</button>
        <button class="nav-tab" data-view="premium" onclick="navigate('premium')" style="background:var(--warm-yellow);">👑 DoodleLab PRO</button>
      </nav>

      <!-- User Auth Pill in Header -->
      <div id="header-auth-box" style="display:flex; align-items:center; gap:0.5rem;"></div>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main class="container" id="app-root">
    <!-- Konten dirender secara dinamis oleh JS -->
  </main>

  <!-- TOAST NOTIFICATIONS -->
  <div id="toast-container"></div>

  <!-- MODAL CONTAINER -->
  <div id="modal-root" class="modal-backdrop hidden"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
      getAuth,
      signInAnonymously,
      signInWithCustomToken,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    /* =========================================================================
       0. FIREBASE INITIALIZATION & HYBRID CLOUD SYNC
       ========================================================================= */
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'doodlelab-default';
    let firebaseEnabled = false;
    let auth = null;
    let db = null;
    let currentFirebaseUser = null;

    try {
      if (typeof __firebase_config !== 'undefined' && __firebase_config) {
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
        firebaseEnabled = true;

        (async () => {
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }
        })().catch(e => console.warn('Auth init fallback:', e));

        onAuthStateChanged(auth, async (user) => {
          currentFirebaseUser = user;
          if (user) {
            await loadCloudProgress(user);
            updateHeaderAuthUI();
            if (typeof window.renderApp === 'function') window.renderApp();
          }
        });
      }
    } catch (e) {
      console.warn('Firebase nonaktif, menjalankan mode lokal:', e);
    }

    async function loadCloudProgress(user) {
      if (!firebaseEnabled || !db || !user) return;
      try {
        const snap = await getDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'progress'));
        if (snap.exists()) {
          const data = snap.data();
          window.hydrateAppState(data, user);
        } else if (user.email) {
          window.appState.email = user.email;
          window.appState.isGuest = false;
          await saveCloudProgress();
        }
      } catch (err) {
        console.warn('Gagal sinkronisasi baca cloud:', err);
      }
    }

    async function saveCloudProgress() {
      if (!firebaseEnabled || !db || !currentFirebaseUser) return;
      try {
        await setDoc(
          doc(db, 'artifacts', appId, 'users', currentFirebaseUser.uid, 'profile', 'progress'),
          JSON.parse(JSON.stringify(window.appState)),
          { merge: true }
        );
      } catch (err) {
        console.warn('Gagal menyimpan ke cloud:', err);
      }
    }

    window.firebaseAuthBridge = {
      isEnabled: () => firebaseEnabled,
      getUser: () => currentFirebaseUser,
      loginEmail: async (email, pass) => {
        if (!firebaseEnabled) throw new Error('Offline mode');
        const cred = await signInWithEmailAndPassword(auth, email, pass);
        return cred.user;
      },
      registerEmail: async (email, pass) => {
        if (!firebaseEnabled) throw new Error('Offline mode');
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        return cred.user;
      },
      loginGuest: async () => {
        if (firebaseEnabled) {
          const cred = await signInAnonymously(auth);
          return cred.user;
        }
        return null;
      },
      logout: async () => {
        if (firebaseEnabled && auth) {
          await signOut(auth);
          await signInAnonymously(auth);
        }
      },
      syncCloud: saveCloudProgress
    };
  </script>

       2. STATE MANAGEMENT, MULTI-ACCOUNT STORAGE & AUTH SYNC
       ========================================================================= */

    const ACCOUNTS_DB_KEY = 'doodlelab_accounts_v2';
    const ACTIVE_SESSION_KEY = 'doodlelab_active_session_v2';

    function getTodayDateString() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function getDefaultState(overrides = {}) {
      return {
        userId: overrides.userId || 'guest-local',
        email: overrides.email || '',
        isGuest: overrides.isGuest !== undefined ? overrides.isGuest : true,
        namaAlias: overrides.namaAlias || 'Penjelajah Sains',
        isPro: false,
        proPlanName: '',
        xp: 0,
        level: 1,
        totalPoin: 0,
        badge: [],
        materiSelesai: [],
        kuisSelesai: [],
        simulasiDicoba: [],
        riwayatProgres: [],
        transactions: [],
        dailyChallenge: {
          tanggal: getTodayDateString(),
          selesai: false
        }
      };
    }

    function getAccountsMap() {
      try {
        return JSON.parse(localStorage.getItem(ACCOUNTS_DB_KEY) || '{}');
      } catch (e) {
        return {};
      }
    }

    function saveAccountsMap(map) {
      try {
        localStorage.setItem(ACCOUNTS_DB_KEY, JSON.stringify(map));
      } catch (e) {}
    }

    function getActiveUserKey() {
      try {
        return localStorage.getItem(ACTIVE_SESSION_KEY) || 'guest-local';
      } catch (e) {
        return 'guest-local';
      }
    }

    function setActiveUserKey(key) {
      try {
        localStorage.setItem(ACTIVE_SESSION_KEY, key);
      } catch (e) {}
    }

    function loadStateForUser(userKey) {
      const accounts = getAccountsMap();
      const raw = accounts[userKey];
      if (!raw || typeof raw !== 'object') {
        return getDefaultState({ userId: userKey, isGuest: userKey === 'guest-local' });
      }
      const def = getDefaultState({ userId: userKey });
      const state = {
        ...def,
        ...raw,
        badge: Array.isArray(raw.badge) ? raw.badge : [],
        materiSelesai: Array.isArray(raw.materiSelesai) ? raw.materiSelesai : [],
        kuisSelesai: Array.isArray(raw.kuisSelesai) ? raw.kuisSelesai : [],
        simulasiDicoba: Array.isArray(raw.simulasiDicoba) ? raw.simulasiDicoba : [],
        riwayatProgres: Array.isArray(raw.riwayatProgres) ? raw.riwayatProgres : [],
        transactions: Array.isArray(raw.transactions) ? raw.transactions : []
      };
      state.level = Math.floor(state.xp / 100) + 1;
      const today = getTodayDateString();
      if (!state.dailyChallenge || state.dailyChallenge.tanggal !== today) {
        state.dailyChallenge = { tanggal: today, selesai: false };
      }
      return state;
    }

    window.appState = loadStateForUser(getActiveUserKey());

    window.hydrateAppState = function(cloudData, fbUser) {
      if (!cloudData || typeof cloudData !== 'object') return;
      const merged = {
        ...window.appState,
        ...cloudData,
        userId: fbUser ? fbUser.uid : window.appState.userId,
        email: fbUser && fbUser.email ? fbUser.email : (cloudData.email || window.appState.email),
        isGuest: fbUser ? fbUser.isAnonymous : window.appState.isGuest
      };
      merged.level = Math.floor(merged.xp / 100) + 1;
      window.appState = merged;
      saveState(false);
    };

    function saveState(syncToCloud = true) {
      window.appState.level = Math.floor(window.appState.xp / 100) + 1;
      const key = window.appState.userId || 'guest-local';
      const accounts = getAccountsMap();
      accounts[key] = window.appState;
      saveAccountsMap(accounts);
      if (syncToCloud && window.firebaseAuthBridge && window.firebaseAuthBridge.syncCloud) {
        window.firebaseAuthBridge.syncCloud();
      }
    }

    async function submitRegister() {
      const alias = (document.getElementById('auth-alias')?.value || '').trim() || 'Ilmuwan Muda';
      const email = (document.getElementById('auth-email')?.value || '').trim().toLowerCase();
      const pass = document.getElementById('auth-pass')?.value || '';

      if (!email || !email.includes('@')) return showAuthError('Masukkan alamat email yang valid.');
      if (pass.length < 6) return showAuthError('Kata sandi minimal 6 karakter.');

      const localKey = 'user_' + email;
      const accounts = getAccountsMap();
      if (accounts[localKey]) {
        return showAuthError('Email ini sudah terdaftar. Silakan masuk melalui tab Masuk Akun.');
      }

      let uid = localKey;
      try {
        if (window.firebaseAuthBridge && window.firebaseAuthBridge.isEnabled()) {
          const fbUser = await window.firebaseAuthBridge.registerEmail(email, pass);
          if (fbUser) uid = fbUser.uid;
        }
      } catch (err) {
        if (err && err.code === 'auth/email-already-in-use') {
          return showAuthError('Email sudah digunakan. Silakan login.');
        }
      }

      const newState = getDefaultState({
        userId: uid,
        email,
        isGuest: false,
        namaAlias: alias.slice(0, 24)
      });
      newState._pw = btoa(pass);
      window.appState = newState;
      setActiveUserKey(uid);
      saveState();
      closeModal();
      updateHeaderAuthUI();
      showToast('🎉', `Selamat datang, ${window.appState.namaAlias}!`, 'var(--science-green)');
      renderApp();
    }

    async function submitLogin() {
      const email = (document.getElementById('auth-email')?.value || '').trim().toLowerCase();
      const pass = document.getElementById('auth-pass')?.value || '';

      if (!email || !pass) return showAuthError('Isi email dan kata sandi terlebih dahulu.');

      const accounts = getAccountsMap();
      const localKey = 'user_' + email;
      let matchedKey = accounts[localKey] ? localKey : Object.keys(accounts).find(k => accounts[k].email === email);

      try {
        if (window.firebaseAuthBridge && window.firebaseAuthBridge.isEnabled()) {
          const fbUser = await window.firebaseAuthBridge.loginEmail(email, pass);
          if (fbUser) {
            matchedKey = fbUser.uid;
            setActiveUserKey(fbUser.uid);
            window.appState = loadStateForUser(fbUser.uid);
            window.appState.email = email;
            window.appState.isGuest = false;
            saveState();
            closeModal();
            updateHeaderAuthUI();
            showToast('🔑', `Berhasil masuk sebagai ${window.appState.namaAlias}!`, 'var(--science-green)');
            renderApp();
            return;
          }
        }
      } catch (err) {
        if (!matchedKey) {
          return showAuthError('Email atau kata sandi tidak cocok.');
        }
      }

      if (!matchedKey) {
        return showAuthError('Akun tidak ditemukan. Silakan daftar akun baru terlebih dahulu.');
      }

      const savedAcc = accounts[matchedKey];
      if (savedAcc._pw && savedAcc._pw !== btoa(pass)) {
        return showAuthError('Kata sandi salah. Silakan periksa kembali.');
      }

      setActiveUserKey(matchedKey);
      window.appState = loadStateForUser(matchedKey);
      window.appState.isGuest = false;
      saveState();
      closeModal();
      updateHeaderAuthUI();
      showToast('🔑', `Selamat datang kembali, ${window.appState.namaAlias}!`, 'var(--science-green)');
      renderApp();
    }

    async function continueAsGuest() {
      if (window.firebaseAuthBridge) await window.firebaseAuthBridge.loginGuest();
      setActiveUserKey('guest-local');
      window.appState = loadStateForUser('guest-local');

    function showToast(icon, text, bg = 'var(--warm-yellow)') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'doodle-toast';
      toast.style.background = bg;
      toast.innerHTML = `<span style="font-size:1.35rem">${icon}</span><span>${text}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
        toast.style.transition = 'all 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 3200);
    }

    function showModal(htmlContent) {
      const modalRoot = document.getElementById('modal-root');
      modalRoot.innerHTML = `<div class="modal-box">${htmlContent}</div>`;
      modalRoot.classList.remove('hidden');
    }

    function closeModal() {
      const modalRoot = document.getElementById('modal-root');
      modalRoot.classList.add('hidden');
      modalRoot.innerHTML = '';
    }

    function awardXP(baseAmount, reasonText) {
      if (baseAmount <= 0) return;
      const multiplier = window.appState.isPro ? 2 : 1;
      const amount = baseAmount * multiplier;

      const oldLevel = window.appState.level;
      window.appState.xp += amount;
      window.appState.totalPoin += amount;
      const newLevel = Math.floor(window.appState.xp / 100) + 1;
      window.appState.level = newLevel;

      const bonusTag = window.appState.isPro ? ' (👑 2x PRO!)' : '';
      showToast('✨', `+${amount} XP${bonusTag} ${reasonText}`, 'var(--science-green)');
      checkAchievements();
      saveState();

      if (newLevel > oldLevel) {
        setTimeout(() => {
          showModal(`
            <div style="font-size:3.5rem; margin-bottom:0.5rem;">🎉🏆🎉</div>
            <h2 style="font-size:2.1rem; color:var(--ink-black);">NAIK KE LEVEL ${newLevel}!</h2>
            <p style="margin:0.75rem 0 1.25rem; font-weight:600;">Luar biasa, <b>${escapeHTML(window.appState.namaAlias)}</b>! Rasa ingin tahumu membuatmu semakin mahir dalam sains!</p>
            <button class="doodle-btn green" onclick="closeModal()">Lanjutkan Petualangan!</button>
          `);
        }, 400);
      }
    }

    function checkAchievements() {
      let unlockedNew = false;
      ACHIEVEMENTS_DATA.forEach(ach => {
        if (!window.appState.badge.includes(ach.id) && ach.check(window.appState)) {
          window.appState.badge.push(ach.id);
          unlockedNew = true;
          setTimeout(() => {
            showToast(ach.icon, `Badge Baru: ${ach.nama}!`, 'var(--playful-purple)');
          }, 500);
        }
      });
      if (unlockedNew) saveState();
    }

    function escapeHTML(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function formatRupiah(num) {
      return 'Rp ' + Number(num).toLocaleString('id-ID');
    }

    /* =========================================================================
       9. VIEW: INTERACTIVE QUIZ ENGINE (28 SOAL)
       ========================================================================= */

    function getAccessibleQuizzes() {
      if (window.appState.isPro) return QUIZ_DATA;
      const proMatIds = MATERI_DATA.filter(m => m.isPro).map(m => m.id);
      return QUIZ_DATA.filter(q => !proMatIds.includes(q.materiId));
    }

    function startQuizByMateri(materiId) {
      const m = MATERI_DATA.find(item => item.id === materiId);
      const qs = QUIZ_DATA.filter(q => q.materiId === materiId);
      launchQuiz(`Kuis: ${m ? m.judul : 'Topik Sains'}`, qs);
    }

    function startQuizByCategory(cat) {
      const matIds = MATERI_DATA.filter(m => m.kategori === cat && (!m.isPro || window.appState.isPro)).map(m => m.id);
      const qs = QUIZ_DATA.filter(q => matIds.includes(q.materiId));
      launchQuiz(`Kuis Kategori ${cat}`, qs);
    }

    function startQuickAllQuiz() {
      const pool = getAccessibleQuizzes();
      const shuffled = [...pool].sort(() => Math.random() - 0.5).slice(0, 10);
      launchQuiz('Tantangan Kuis Sains Campuran (10 Soal)', shuffled);
    }

    function launchQuiz(title, questions) {
      quizSession = {
        active: true,
        title,
        questions,
        index: 0,
        scoreCount: 0,
        xpEarned: 0,
        answered: false,
        selectedOpt: null
      };
      navigate('kuis');
    }

    function submitQuizAnswer(optIndex) {
      if (quizSession.answered) return;
      const q = quizSession.questions[quizSession.index];
      quizSession.answered = true;
      quizSession.selectedOpt = optIndex;

      const isCorrect = optIndex === q.jawabanBenar;
      if (isCorrect) {
        quizSession.scoreCount += 1;
        if (!window.appState.kuisSelesai.includes(q.id)) {
          window.appState.kuisSelesai.push(q.id);
          const earned = q.poin * (window.appState.isPro ? 2 : 1);
          quizSession.xpEarned += earned;
          awardXP(q.poin, 'Jawaban Kuis Tepat!');
        } else {
          showToast('✔️', 'Benar! (Poin soal ini sudah pernah diklaim)', 'var(--doodle-blue)');
        }
      }
      window.renderApp();
    }

    function nextQuizQuestion() {
      quizSession.index += 1;
      quizSession.answered = false;
      quizSession.selectedOpt = null;
      window.renderApp();
    }

    function exitQuiz() {
      quizSession.active = false;
      window.renderApp();
    }

    function renderQuizView() {
      const accessible = getAccessibleQuizzes();
      if (!quizSession.active) {
        const solvedCount = window.appState.kuisSelesai.length;
        return `
          <div class="section-header">
            <h2 class="section-title">✏️ Arena Kuis Interaktif Sains</h2>
            <span class="tag-badge" style="background:var(--warm-yellow);">Soal Dikuasai: ${solvedCount} / ${accessible.length}</span>
          </div>

          <div class="doodle-card" style="margin-bottom:1.5rem; background:linear-gradient(135deg,#FFFDF7,#EBF7FF);">
            <h3 style="font-size:1.75rem; margin-bottom:0.4rem;">🎲 Tantangan Kuis Cepat (${accessible.length} Bank Soal)</h3>
            <p style="margin-bottom:1rem;">Uji pemahamanmu dari seluruh cabang ilmu sains! ${window.appState.isPro ? '<b>👑 Bonus PRO 2x XP Aktif!</b>' : 'Upgrade ke PRO untuk mendapatkan <b>2x XP</b> pada setiap kuis!'}</p>
            <div style="display:flex; flex-wrap:wrap; gap:0.75rem;">
              <button class="doodle-btn" onclick="startQuickAllQuiz()">🚀 Mulai 10 Soal Acak</button>
              <button class="doodle-btn green" onclick="launchQuiz('Maraton Lengkap ${accessible.length} Soal Sains', getAccessibleQuizzes())">🏆 Maraton Semua ${accessible.length} Soal</button>
            </div>
          </div>

          <h3 style="font-size:1.55rem; margin-bottom:0.85rem;">Pilih Kuis Berdasarkan Kategori:</h3>
          <div class="grid-4">
            ${CATEGORIES.map(cat => {
              const matIds = MATERI_DATA.filter(m => m.kategori === cat.id && (!m.isPro || window.appState.isPro)).map(m => m.id);
              const qs = QUIZ_DATA.filter(q => matIds.includes(q.materiId));
              const done = qs.filter(q => window.appState.kuisSelesai.includes(q.id)).length;
              return `
                <div class="doodle-card interactive">
                  <span class="tag-badge cat-${cat.id}" style="margin-bottom:0.6rem;">${cat.nama}</span>
                  <h4 style="font-family:var(--font-display); font-size:1.45rem;">Kuis ${cat.nama}</h4>
                  <p style="font-size:0.88rem; color:var(--ink-muted); margin:0.35rem 0 0.9rem;">Selesai: ${done}/${qs.length} soal</p>
                  <button class="doodle-btn sm" style="width:100%; background:${cat.color};" onclick="startQuizByCategory('${cat.id}')">Mulai Kuis</button>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      if (quizSession.index >= quizSession.questions.length) {
        const total = quizSession.questions.length;
        const pct = Math.round((quizSession.scoreCount / total) * 100);
        return `
          <div class="doodle-card" style="max-width:620px; margin:0 auto; text-align:center;">
            <div style="font-size:3.5rem; margin-bottom:0.5rem;">${pct >= 70 ? '🎉🌟🎉' : '📝💡'}</div>
            <h2 style="font-size:2.1rem; margin-bottom:0.35rem;">Hasil Akhir Kuis</h2>
            <p class="ui-font" style="color:var(--ink-muted); margin-bottom:1.25rem;">${quizSession.title}</p>

            <div style="background:var(--bg-cream); border:2.5px solid var(--ink-black); border-radius:18px; padding:1.2rem; margin-bottom:1.25rem;">
              <div style="font-size:2.4rem; font-family:var(--font-display); font-weight:700;">Skor: ${pct}%</div>
              <p style="font-weight:700;">Jawaban Benar: ${quizSession.scoreCount} dari ${total} soal</p>
              <p style="color:#2B7A3D; font-weight:800; margin-top:0.35rem;">Total XP Baru Diperoleh: +${quizSession.xpEarned} XP</p>
            </div>

            <div style="display:flex; gap:0.75rem; justify-content:center; flex-wrap:wrap;">
              <button class="doodle-btn cream" onclick="exitQuiz()">← Daftar Kuis</button>
              <button class="doodle-btn green" onclick="navigate('dashboard')">🏠 Kembali ke Beranda</button>
            </div>
          </div>
        `;
      }

      const q = quizSession.questions[quizSession.index];
      const alreadyClaimed = window.appState.kuisSelesai.includes(q.id) && !quizSession.answered;
      const potentialXP = q.poin * (window.appState.isPro ? 2 : 1);

      return `
        <div style="max-width:740px; margin:0 auto;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.85rem;">
            <button class="doodle-btn cream sm" onclick="exitQuiz()">✕ Keluar Kuis</button>
            <span class="ui-font">Soal ${quizSession.index + 1} dari ${quizSession.questions.length}</span>
          </div>

          <div class="doodle-card">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem; margin-bottom:0.85rem;">
              <span class="tag-badge" style="background:var(--doodle-blue);">${quizSession.title}</span>
              <span class="tag-badge" style="background:${alreadyClaimed ? 'var(--bg-cream)' : 'var(--warm-yellow)'};">
                ${alreadyClaimed ? '🔄 Mode Latihan (Poin Sudah Diklaim)' : `🎁 Hadiah: +${potentialXP} XP`}
              </span>
            </div>

            <h3 style="font-size:1.6rem; margin-bottom:1.15rem;">${q.pertanyaan}</h3>

            <div>
              ${q.pilihanJawaban.map((opt, idx) => {
                let cls = 'quiz-option';
                if (quizSession.answered) {
                  if (idx === q.jawabanBenar) cls += ' correct';
                  else if (idx === quizSession.selectedOpt) cls += ' wrong';
                }
                return `
                  <button class="${cls}" ${quizSession.answered ? 'disabled' : ''} onclick="submitQuizAnswer(${idx})">
                    <span class="option-letter">${['A','B','C','D'][idx]}</span>
                    <span>${opt}</span>
                  </button>
                `;
              }).join('')}
            </div>

            ${quizSession.answered ? `
              <div style="margin-top:1.1rem; padding:1rem; border-radius:14px; border:2.5px solid var(--ink-black); background:${quizSession.selectedOpt === q.jawabanBenar ? '#E4F7E7' : '#FDE8E5'};">
                <div class="ui-font" style="font-size:1.05rem; margin-bottom:0.3rem;">
                  ${quizSession.selectedOpt === q.jawabanBenar ? '🎉 Tepat Sekali!' : '💡 Kurang Tepat, Mari Pelajari:'}
                </div>
                <p style="font-size:0.96rem;">${q.penjelasan}</p>
                <div style="margin-top:0.9rem; text-align:right;">
                  <button class="doodle-btn" onclick="nextQuizQuestion()">
                    ${quizSession.index + 1 < quizSession.questions.length ? 'Soal Berikutnya →' : 'Lihat Hasil Akhir 🏆'}
                  </button>
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    function initActiveSimulation() {
      const canvas = document.getElementById('sim-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      markSimulationTried(activeSimId);

      if (activeSimId === 'gravity') {
        let balls = [
          { x: 260, y: 70, vy: 0, r: 22, color: '#F28F83', label: 'Bola A' },
          { x: 560, y: 70, vy: 0, r: 15, color: '#75B9E7', label: 'Bola B' }
        ];
        const floorY = 315;

        function spawnBall(x, y) {
          const colors = ['#F28F83', '#75B9E7', '#91C99A', '#FFD66B', '#A994E8'];
          balls.push({
            x: Math.max(40, Math.min(860, x)),
            y: Math.max(30, Math.min(240, y)),
            vy: 0,
            r: 14 + Math.floor(Math.random() * 12),
            color: colors[balls.length % colors.length],
            label: `#${balls.length + 1}`
          });
        }

        canvas.addEventListener('click', (e) => {
          const rect = canvas.getBoundingClientRect();
          spawnBall((e.clientX - rect.left) * (canvas.width / rect.width), (e.clientY - rect.top) * (canvas.height / rect.height));
        });

        document.getElementById('btn-drop-ball').onclick = () => spawnBall(150 + Math.random() * 600, 50);
        document.getElementById('btn-clear-balls').onclick = () => { balls = []; };

        function loopGravity() {
          const g = parseFloat(document.getElementById('grav-planet').value);
          const bounce = parseFloat(document.getElementById('grav-bounce').value);

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.strokeStyle = 'rgba(41,45,50,0.07)';
          ctx.lineWidth = 1;
          for (let x = 0; x < canvas.width; x += 30) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
          for (let y = 0; y < canvas.height; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

          ctx.fillStyle = '#91C99A';
          ctx.fillRect(0, floorY, canvas.width, canvas.height - floorY);
          ctx.strokeStyle = '#292D32';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(canvas.width, floorY); ctx.stroke();

          ctx.fillStyle = '#292D32';
          ctx.font = 'bold 16px Fredoka, sans-serif';
          ctx.fillText(`Gravitasi Aktif (g) = ${g} m/s²  |  Klik kanvas untuk menambah bola`, 20, 30);

          balls.forEach(b => {
            b.vy += g * 0.045;
            b.y += b.vy;
            if (b.y + b.r >= floorY) {
              b.y = floorY - b.r;
              b.vy = -b.vy * bounce;
              if (Math.abs(b.vy) < 0.6) b.vy = 0;
            }
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            ctx.fillStyle = b.color;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#292D32';
            ctx.stroke();

            if (Math.abs(b.vy) > 1.2) {
              ctx.beginPath();
              ctx.moveTo(b.x, b.y);
              ctx.lineTo(b.x, b.y + b.vy * 3.5);
              ctx.strokeStyle = '#292D32';
              ctx.lineWidth = 2;
              ctx.stroke();
            }
          });
          activeSimLoop = requestAnimationFrame(loopGravity);
        }
        loopGravity();
      } else if (activeSimId === 'solar') {
        const planets = [
          { name: 'Merkurius', dist: 58, r: 6, speed: 0.032, angle: 0.4, color: '#B8B2A6', fact: 'Merkurius: Planet terkecil & tercepat (1 tahun = 88 hari Bumi).' },
          { name: 'Venus', dist: 92, r: 9, speed: 0.022, angle: 1.8, color: '#FFD66B', fact: 'Venus: Planet terpanas karena efek rumah kaca atmosfer CO₂ yang tebal.' },
          { name: 'Bumi', dist: 132, r: 10, speed: 0.016, angle: 3.1, color: '#75B9E7', fact: 'Bumi: Satu-satunya planet yang diketahui memiliki air cair di permukaan.' },
          { name: 'Mars', dist: 170, r: 8, speed: 0.012, angle: 5.0, color: '#F28F83', fact: 'Mars: Memiliki gunung berapi tertinggi di Tata Surya, Olympus Mons.' },
          { name: 'Jupiter', dist: 225, r: 18, speed: 0.007, angle: 2.3, color: '#E8B87D', fact: 'Jupiter: Planet terbesar, massanya lebih dari 2x gabungan seluruh planet lain!' }
        ];
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        canvas.addEventListener('click', (e) => {
          const rect = canvas.getBoundingClientRect();
          const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
          const my = (e.clientY - rect.top) * (canvas.height / rect.height);
          planets.forEach(p => {
            const px = cx + Math.cos(p.angle) * p.dist * 1.45;
            const py = cy + Math.sin(p.angle) * p.dist * 0.72;
            if (Math.hypot(mx - px, my - py) <= p.r + 14) {
              document.getElementById('planet-info-pill').textContent = `🪐 ${p.fact}`;
            }
          });
        });

        function loopSolar() {
          const speedMult = parseFloat(document.getElementById('orbit-speed').value);
          const showLines = document.getElementById('orbit-lines').checked;
          ctx.fillStyle = '#232730';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = '#FFF8E9';
          for (let i = 0; i < 35; i++) {
            ctx.fillRect((i * 197) % canvas.width, (i * 89) % canvas.height, 2.5, 2.5);
          }

          ctx.beginPath();
          ctx.arc(cx, cy, 26, 0, Math.PI * 2);
          ctx.fillStyle = '#FFD66B';
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#F28F83';
          ctx.stroke();

          planets.forEach(p => {
            p.angle += p.speed * speedMult;
            const rx = p.dist * 1.45;
            const ry = p.dist * 0.72;
            if (showLines) {
              ctx.beginPath();
              ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
              ctx.strokeStyle = 'rgba(255, 248, 233, 0.25)';
              ctx.setLineDash([5, 5]);
              ctx.lineWidth = 1.5;
              ctx.stroke();
              ctx.setLineDash([]);
            }
            const px = cx + Math.cos(p.angle) * rx;
            const py = cy + Math.sin(p.angle) * ry;
            ctx.beginPath();
            ctx.arc(px, py, p.r, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#FFFDF7';
            ctx.stroke();

            if (showLines) {
              ctx.fillStyle = '#FFFDF7';
              ctx.font = 'bold 13px Fredoka, sans-serif';
              ctx.fillText(p.name, px + p.r + 5, py + 4);
            }
          });
          activeSimLoop = requestAnimationFrame(loopSolar);
        }
        loopSolar();
      } else if (activeSimId === 'circuit') {
        let switchClosed = true;
        let electronOffset = 0;

        function toggleSwitch() {
          switchClosed = !switchClosed;
          const btn = document.getElementById('btn-toggle-switch');
          btn.textContent = switchClosed ? '🔌 Sakelar: TERTUTUP (ON)' : '🔌 Sakelar: TERBUKA (OFF)';
          btn.className = switchClosed ? 'doodle-btn green sm' : 'doodle-btn coral sm';
        }

        document.getElementById('btn-toggle-switch').onclick = toggleSwitch;
        canvas.addEventListener('click', toggleSwitch);

        function loopCircuit() {
          const V = parseFloat(document.getElementById('circuit-volt').value);
          const R = parseFloat(document.getElementById('circuit-ohm').value);
          const I = switchClosed ? (V / R) : 0;

          document.getElementById('circuit-readout').textContent =
            switchClosed ? `Arus (I) = ${I.toFixed(2)} A` : 'Arus (I) = 0.00 A (Putus)';

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const left = 180, right = 720, top = 80, bottom = 280;
          ctx.strokeStyle = '#292D32';
          ctx.lineWidth = 5;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          ctx.beginPath();
          ctx.moveTo(left, top);
          ctx.lineTo(left, bottom);
          ctx.lineTo(right, bottom);
          ctx.lineTo(right, top);
          ctx.lineTo(500, top);
          ctx.moveTo(390, top);
          ctx.lineTo(left, top);
          ctx.stroke();

          ctx.fillStyle = '#292D32';
          ctx.beginPath(); ctx.arc(390, top, 6, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.arc(500, top, 6, 0, Math.PI * 2); ctx.fill();

          ctx.beginPath();
          ctx.moveTo(390, top);
          if (switchClosed) ctx.lineTo(500, top);
          else ctx.lineTo(485, top - 42);
          ctx.strokeStyle = switchClosed ? '#2B7A3D' : '#F28F83';
          ctx.lineWidth = 5;
          ctx.stroke();

          ctx.fillStyle = '#292D32';
          ctx.font = 'bold 14px Fredoka, sans-serif';
          ctx.fillText('Sakelar (Klik untuk ubah)', 375, top - 50);

          ctx.fillStyle = '#FFD66B';
          ctx.strokeStyle = '#292D32';
          ctx.lineWidth = 3;
          ctx.fillRect(left - 28, 145, 56, 70);
          ctx.strokeRect(left - 28, 145, 56, 70);
          ctx.fillStyle = '#292D32';
          ctx.fillText(`+${V}V`, left - 18, 185);

          ctx.fillStyle = '#A994E8';
          ctx.fillRect(400, bottom - 18, 100, 36);
          ctx.strokeRect(400, bottom - 18, 100, 36);
          ctx.fillStyle = '#292D32';
          ctx.fillText(`Resistor ${R}Ω`, 412, bottom + 5);

          const brightness = Math.min(1, I / 0.6);
          if (switchClosed && brightness > 0.02) {
            const grad = ctx.createRadialGradient(right, 180, 10, right, 180, 45 + brightness * 55);
            grad.addColorStop(0, `rgba(255, 214, 107, ${0.4 + brightness * 0.55})`);
            grad.addColorStop(1, 'rgba(255, 214, 107, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(right, 180, 45 + brightness * 55, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.beginPath();
          ctx.arc(right, 180, 28, 0, Math.PI * 2);
          ctx.fillStyle = switchClosed ? `rgba(255, 214, 107, ${0.25 + brightness * 0.75})` : '#EFE7D6';
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = '#292D32';
          ctx.stroke();
          ctx.fillStyle = '#292D32';
          ctx.fillText('Lampu', right + 36, 185);

          if (switchClosed && I > 0) {
            electronOffset = (electronOffset + I * 8) % 40;
            ctx.fillStyle = '#75B9E7';
            for (let y = top + electronOffset; y < bottom; y += 40) { ctx.beginPath(); ctx.arc(left, y, 5, 0, Math.PI * 2); ctx.fill(); }
            for (let x = left + electronOffset; x < right; x += 40) { ctx.beginPath(); ctx.arc(x, bottom, 5, 0, Math.PI * 2); ctx.fill(); }
            for (let y = bottom - electronOffset; y > top; y -= 40) { ctx.beginPath(); ctx.arc(right, y, 5, 0, Math.PI * 2); ctx.fill(); }
            for (let x = right - electronOffset; x > left; x -= 40) { ctx.beginPath(); ctx.arc(x, top, 5, 0, Math.PI * 2); ctx.fill(); }
          }
          activeSimLoop = requestAnimationFrame(loopCircuit);
        }
        loopCircuit();
      } else if (activeSimId === 'optics') {
        let phase = 0;
        function loopOptics() {
          const f1 = parseFloat(document.getElementById('wave-freq1').value);
          const f2 = parseFloat(document.getElementById('wave-freq2').value);
          const amp = parseFloat(document.getElementById('wave-amp').value);
          phase += 0.06;

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          // Sumbu referensi
          ctx.strokeStyle = 'rgba(41,45,50,0.2)';
          ctx.setLineDash([5, 5]);
          ctx.beginPath(); ctx.moveTo(20, 95); ctx.lineTo(540, 95); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(20, 255); ctx.lineTo(540, 255); ctx.stroke();
          ctx.setLineDash([]);

          ctx.fillStyle = '#292D32';
          ctx.font = 'bold 14px Fredoka, sans-serif';
          ctx.fillText('Gelombang 1 (Biru) & Gelombang 2 (Coral)', 24, 26);
          ctx.fillText('Superposisi / Interferensi Resultan (Ungu)', 24, 185);

          // Wave 1 & Wave 2
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = '#75B9E7';
          ctx.beginPath();
          for (let x = 20; x <= 540; x += 4) {
            const y = 95 + Math.sin(x * 0.02 * f1 + phase) * (amp * 0.65);
            if (x === 20) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.stroke();

          ctx.strokeStyle = '#F28F83';
          ctx.beginPath();
          for (let x = 20; x <= 540; x += 4) {
            const y = 95 + Math.sin(x * 0.02 * f2 - phase * 1.2) * (amp * 0.65);
            if (x === 20) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.stroke();

          // Resultant Superposition Wave
          ctx.strokeStyle = '#A994E8';
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          for (let x = 20; x <= 540; x += 4) {
            const y1 = Math.sin(x * 0.02 * f1 + phase) * (amp * 0.65);
            const y2 = Math.sin(x * 0.02 * f2 - phase * 1.2) * (amp * 0.65);
            const y = 255 + (y1 + y2);
            if (x === 20) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.stroke();

          // Prism Dispersi Cahaya di Sisi Kanan
          ctx.fillStyle = '#232730';
          ctx.fillRect(570, 20, 310, 320);

          // Sinar putih masuk
          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(580, 210); ctx.lineTo(685, 175); ctx.stroke();

          // Spektrum Pelangi keluar dari prisma
          const rainbow = ['#F28F83', '#FFB84D', '#FFD66B', '#91C99A', '#75B9E7', '#A994E8'];
          rainbow.forEach((col, i) => {
            ctx.strokeStyle = col;
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(745, 170 + i * 3);
            ctx.lineTo(875, 145 + i * 24);
            ctx.stroke();
          });

          // Segitiga Prisma Kaca
          ctx.beginPath();
          ctx.moveTo(715, 105);
          ctx.lineTo(660, 235);
          ctx.lineTo(770, 235);
          ctx.closePath();
          ctx.fillStyle = 'rgba(117, 185, 231, 0.35)';
          ctx.fill();
          ctx.strokeStyle = '#FFFDF7';
          ctx.lineWidth = 2.5;
          ctx.stroke();

          ctx.fillStyle = '#FFFDF7';
          ctx.fillText('Prisma Dispersi Cahaya', 640, 270);

          activeSimLoop = requestAnimationFrame(loopOptics);

        loopOptics();
      }

      if (checkoutState.appliedPromo) {

          discount = Math.round(subtotal * (checkoutState.appliedPromo.value / 100));
        } else {
          discount = checkoutState.appliedPromo.value;
        }

      const adminFee = 2500;
      const total = Math.max(0, subtotal - discount + adminFee);
      return { plan, subtotal, discount, adminFee, total };

                return `
                  <div class="lb-row ${item.isMe ? 'is-me' : ''}">
                    <div style="display:flex; align-items:center; gap:0.65rem;">
                      <span class="ui-font" style="font-size:1.1rem; min-width:30px;">${medal}</span>
                      <span style="font-size:1.4rem;">${item.avatar}</span>
                      <div>
                        <div class="ui-font" style="font-size:0.98rem;">
                          ${escapeHTML(item.namaAlias)} ${item.isPro ? '👑' : ''}
                        </div>
                        <div style="font-size:0.78rem; color:var(--ink-muted); font-weight:700;">Level ${lvl}</div>
                      </div>
                    </div>
                    <span class="tag-badge" style="background:var(--bg-paper);">⚡ ${item.xp} XP</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>

        <div class="section-header">
          <h2 class="section-title">🎖️ Koleksi Stiker Pencapaian (${s.badge.length}/${ACHIEVEMENTS_DATA.length})</h2>
        </div>
        <div class="grid-4">
          ${ACHIEVEMENTS_DATA.map(ach => {
            const unlocked = s.badge.includes(ach.id);
            return `
              <div class="sticker-badge ${unlocked ? 'unlocked' : 'locked'}">
                <span class="sticker-icon">${ach.icon}</span>
                <div class="ui-font" style="font-size:1.05rem;">${ach.nama}</div>
                <p style="font-size:0.84rem; color:var(--ink-muted); margin:0.35rem 0;">${ach.deskripsi}</p>
                <span class="tag-badge" style="background:${unlocked ? 'var(--science-green)' : 'var(--bg-cream)'};">
                  ${unlocked ? '✅ Diperoleh' : '🔒 Belum Tercapai'}
                </span>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    /* =========================================================================
       13. MAIN RENDER DISPATCHER
       ========================================================================= */

    window.renderApp = function() {
      const root = document.getElementById('app-root');
      if (currentView === 'dashboard') {
        root.innerHTML = renderDashboard();
      } else if (currentView === 'materi') {
        root.innerHTML = renderMateriList();
      } else if (currentView === 'materi-detail') {
        root.innerHTML = renderMateriDetail();
      } else if (currentView === 'kuis') {
        root.innerHTML = renderQuizView();
      } else if (currentView === 'simulasi') {
        root.innerHTML = renderSimulasiView();
        initActiveSimulation();
      } else if (currentView === 'pencapaian') {
        root.innerHTML = renderPencapaianView();
      } else if (currentView === 'premium') {
        root.innerHTML = renderPremiumView();
      }
    };

    checkAchievements();
    updateHeaderAuthUI();
    window.renderApp();
  </script>
</body>
</html>
